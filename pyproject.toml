[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomechanics-framework"
version = "3.0.0"
authors = [
  { name="Saeed Gharedaghi", email="sqaredaqi70@gmail.com" },
]
description = "A comprehensive Python framework for petroleum geomechanics, 3D reservoir earth modeling, wellbore stability, and subsidence analysis."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "lasio>=0.29.0",
    "scikit-learn>=0.24.0",
]

[project.urls]
"Homepage" = "https://github.com/sqaredaqi70-dot/Geomechanics-Python-Framework"
"Bug Tracker" = "https://github.com/sqaredaqi70-dot/Geomechanics-Python-Framework/issues"
