name: Python Application Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Test Synthetic Data Generation
      run: |
        python modules/subsidence_analysis/data/generate_synthetic_grid.py
        python modules/reservoir_3d_geomechanics/data/generate_synthetic_3d_cubes.py
        
    - name: Test Example Workflows
      run: |
        python modules/subsidence_analysis/examples/visualization_example.py
        python modules/reservoir_3d_geomechanics/examples/01_full_3d_geomechanics_workflow.py
