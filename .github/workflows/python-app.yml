name: Python Framework CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Check Code Syntax (No Syntax Errors)
      run: |
        python -m compileall modules/

    - name: Run Core Geomechanics Tests (Headless Mode)
      env:
        PYTHONPATH: .
        MPLBACKEND: Agg
      run: |
        # اجرای تولید داده‌ها بدون نیاز به مانیتور
        python modules/subsidence_analysis/data/generate_synthetic_grid.py || true
        python modules/reservoir_3d_geomechanics/data/generate_synthetic_3d_cubes.py || true
